<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Figma Handoff Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #1a1a1a;
      margin-bottom: 30px;
    }
    .badge-demo {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(108,101,95,0.08);
      border-radius: 8px;
      padding: 6px 12px;
      font-family: 'Pretendard', sans-serif;
      font-weight: 500;
      color: rgba(47,43,39,0.61);
      white-space: nowrap;
    }
    .badge-small {
      height: 20px;
      font-size: 11px;
      padding: 6px;
      border-radius: 6px;
    }
    .badge-medium {
      height: 28px;
      font-size: 13px;
      padding: 8px;
      border-radius: 8px;
    }
    .screenshot {
      margin-top: 20px;
      padding: 20px;
      background: #fafafa;
      border-radius: 8px;
    }
    .screenshot img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #e8f4f8;
      border-radius: 8px;
      font-size: 14px;
    }
    .info code {
      background: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', Monaco, monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Figma → React Handoff Test</h1>
    
    <div class="badge-demo">
      <div>
        <strong>ContentBadge Component:</strong>
        <div style="margin-top: 10px; display: flex; gap: 8px; align-items: center;">
          <span class="badge badge-small">XSmall 배지</span>
          <span class="badge badge-medium">Medium 배지</span>
          <span class="badge badge-small">텍스트 테스트</span>
        </div>
      </div>
    </div>
    
    <div class="screenshot">
      <h3>📸 Figma Screenshot</h3>
      <img src="/screenshots/ContentBadgeContentBadge_0.png" alt="Figma Component" />
    </div>
    
    <div class="info">
      <h3>📄 정보</h3>
      <p><strong>컴포넌트:</strong> <code>ContentBadgeContentBadge</code></p>
      <p><strong>위치:</strong> <code>test/src/components/ContentBadgeContentBadge.tsx</code></p>
      <p><strong>에셋:</strong> <code>test/src/assets/ContentBadgeContentBadge_imgVariant.png</code></p>
      <p><strong>Ollama 분석:</strong> 색상, 텍스트, 요약 정보 추출 완료</p>
    </div>
  </div>
</body>
</html>
