<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Figma Cost Optimizer Bridge local architecture</title>
  <desc id="desc">Dark architecture diagram showing MCP clients and Figma Desktop feeding a local bridge pipeline, which captures Figma data, normalizes it, compresses repeated structures, reuses cache and returns compact multi-framework web handoffs.</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(650 310) rotate(90) scale(390 620)">
      <stop stop-color="#0F766E" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bridgeFill" x1="410" y1="150" x2="870" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E3B43"/>
      <stop offset="0.56" stop-color="#102A3A"/>
      <stop offset="1" stop-color="#17152D"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12" stroke="#5EEAD4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 40px; font-weight: 850; fill: #F8FAFC; }
      .subtitle { font-size: 18px; font-weight: 650; fill: #CBD5E1; }
      .eyebrow { font-size: 13px; font-weight: 850; letter-spacing: 0.08em; fill: #5EEAD4; }
      .cardTitle { font-size: 24px; font-weight: 850; fill: #F8FAFC; }
      .cardCopy { font-size: 15px; font-weight: 700; fill: #94A3B8; }
      .bridgeTitle { font-size: 30px; font-weight: 850; fill: #FFFFFF; }
      .bridgeCopy { font-size: 16px; font-weight: 700; fill: #BFE8E3; }
      .stageTitle { font-size: 18px; font-weight: 850; fill: #F8FAFC; }
      .stageCopy { font-size: 13px; font-weight: 700; fill: #A7F3D0; }
      .outputTitle { font-size: 22px; font-weight: 850; fill: #F8FAFC; }
      .outputCopy { font-size: 15px; font-weight: 750; fill: #CBD5E1; }
      .badge { font-size: 16px; font-weight: 850; fill: #FED7AA; }
      .tiny { font-size: 12px; font-weight: 750; fill: #94A3B8; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" rx="30" fill="#020617"/>
  <rect width="1280" height="640" rx="30" fill="url(#glow)"/>
  <path d="M60 148H1220M60 244H1220M60 340H1220M60 436H1220M60 532H1220M184 72V568M348 72V568M512 72V568M676 72V568M840 72V568M1004 72V568M1168 72V568" stroke="#1E293B" stroke-width="1" opacity="0.45"/>
  <rect x="28" y="28" width="1224" height="584" rx="26" stroke="#1E293B"/>

  <text x="70" y="82" class="sans title">Figma Cost Optimizer Bridge</text>
  <text x="70" y="116" class="sans subtitle">Local MCP middleware for compact, multi-framework Figma handoffs.</text>
  <g transform="translate(946 58)">
    <rect width="246" height="48" rx="24" fill="#2A170B" stroke="#FB923C"/>
    <text x="123" y="31" text-anchor="middle" class="sans badge">48.07% fewer tokens</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="178" width="300" height="150" rx="22" fill="url(#cardFill)" stroke="#334155"/>
    <text x="98" y="212" class="sans eyebrow">INPUT</text>
    <text x="98" y="250" class="sans cardTitle">MCP Client</text>
    <text x="98" y="280" class="sans cardCopy">Codex, Claude, Cursor</text>
    <text x="98" y="310" class="mono tiny">calls get_optimized_figma_handoff</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="382" width="300" height="140" rx="22" fill="url(#cardFill)" stroke="#334155"/>
    <text x="98" y="416" class="sans eyebrow">LOCAL SOURCE</text>
    <text x="98" y="454" class="sans cardTitle">Figma Desktop</text>
    <text x="98" y="484" class="sans cardCopy">context + screenshot</text>
    <text x="98" y="512" class="mono tiny">127.0.0.1:3845</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="150" width="420" height="372" rx="30" fill="url(#bridgeFill)" stroke="#5EEAD4" stroke-opacity="0.55"/>
    <text x="470" y="198" class="sans eyebrow">LOCAL ONLY</text>
    <text x="470" y="236" class="sans bridgeTitle">Bridge Pipeline</text>
    <text x="470" y="264" class="sans bridgeCopy">No cloud relay. Files stay on disk.</text>

    <g transform="translate(470 296)">
      <rect width="340" height="44" rx="14" fill="#0F172A" fill-opacity="0.72" stroke="#22D3EE" stroke-opacity="0.65"/>
      <circle cx="24" cy="22" r="12" fill="#22D3EE"/>
      <text x="48" y="20" class="sans stageTitle">1. Capture</text>
      <text x="166" y="20" class="sans stageCopy">Figma data</text>
    </g>
    <g transform="translate(470 350)">
      <rect width="340" height="44" rx="14" fill="#0F172A" fill-opacity="0.72" stroke="#5EEAD4" stroke-opacity="0.65"/>
      <circle cx="24" cy="22" r="12" fill="#5EEAD4"/>
      <text x="48" y="20" class="sans stageTitle">2. Normalize</text>
      <text x="182" y="20" class="sans stageCopy">metadata, coords, SVG</text>
    </g>
    <g transform="translate(470 404)">
      <rect width="340" height="44" rx="14" fill="#0F172A" fill-opacity="0.72" stroke="#A7F3D0" stroke-opacity="0.65"/>
      <circle cx="24" cy="22" r="12" fill="#A7F3D0"/>
      <text x="48" y="20" class="sans stageTitle">3. Compress</text>
      <text x="182" y="20" class="sans stageCopy">repeat UI to props</text>
    </g>
    <g transform="translate(470 458)">
      <rect width="340" height="44" rx="14" fill="#0F172A" fill-opacity="0.72" stroke="#FBBF24" stroke-opacity="0.75"/>
      <circle cx="24" cy="22" r="12" fill="#FBBF24"/>
      <text x="48" y="20" class="sans stageTitle">4. Reuse</text>
      <text x="150" y="20" class="sans stageCopy">cache, diff, registry</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="196" width="280" height="276" rx="24" fill="url(#cardFill)" stroke="#334155"/>
    <text x="960" y="232" class="sans eyebrow">OUTPUT</text>
    <text x="960" y="270" class="sans outputTitle">Optimized Handoff</text>
    <text x="960" y="312" class="sans outputCopy">Compact Markdown</text>
    <text x="960" y="348" class="sans outputCopy">Target profile guidance</text>
    <text x="960" y="384" class="sans outputCopy">Design tokens</text>
    <text x="960" y="420" class="sans outputCopy">Screenshot file paths</text>
  </g>

  <path d="M370 253H420" stroke="#5EEAD4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M370 452H420" stroke="#5EEAD4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M850 334H920" stroke="#5EEAD4" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(410 546)">
    <rect width="460" height="38" rx="19" fill="#020617" stroke="#334155"/>
    <text x="230" y="25" text-anchor="middle" class="sans tiny">Writes .figma_cache, handoff.md, diff.md, screenshot.png, registry.json</text>
  </g>
</svg>
